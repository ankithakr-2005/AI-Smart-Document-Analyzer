<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - {{ document.filename }}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .chat-container {
            max-width: 900px;
        }
        .message-bubble {
            max-width: 80%;
            border-radius: 1rem;
            padding: 1rem 1.25rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .user-message {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: white;
            border-bottom-right-radius: 0.2rem;
        }
        .ai-message {
            background-color: #ffffff;
            color: #212529;
            border: 1px solid #dee2e6;
            border-bottom-left-radius: 0.2rem;
        }
        .ai-message h3, .ai-message h4, .ai-message h5 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0d6efd;
            margin-top: 0.5rem;
        }
        .ai-message ul, .ai-message ol {
            padding-left: 1.2rem;
            margin-bottom: 0.5rem;
        }
        /* Custom smooth scrollbar */
        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background-color: #ced4da;
            border-radius: 10px;
        }
    </style>
</head>
<body class="d-flex flex-column vh-100">

    <!-- Modern Navbar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm px-4">
        <div class="container-fluid py-1">
            <a class="navbar-brand fw-bold text-decoration-none d-flex align-items-center gap-2" href="/">
                <span>🏠</span> SmartDoc AI
            </a>
            <span class="badge bg-primary px-3 py-2 rounded-pill fw-normal">📄 {{ document.filename }}</span>
        </div>
    </nav>

    <!-- Main Chat Workspace -->
    <div class="container chat-container my-4 flex-grow-1 d-flex flex-column overflow-hidden">
        <div class="card shadow-sm flex-grow-1 border-0 d-flex flex-column overflow-hidden">
            
            <!-- Chat History Scroll Box -->
            <div class="card-body overflow-auto p-4 flex-grow-1" id="chat-box">
                {% if history %}
                    {% for chat in history %}
                        <!-- User Message -->
                        <div class="mb-4 d-flex justify-content-end">
                            <div class="message-bubble user-message">
                                <div class="fw-bold small mb-1 text-white-50">You</div>
                                {{ chat.question }}
                            </div>
                        </div>
                        <!-- AI Response -->
                        <div class="mb-4 d-flex justify-content-start">
                            <div class="message-bubble ai-message w-100" data-raw-answer="{{ chat.answer | e }}">
                                <div class="fw-bold small mb-1 text-primary">Gemini AI</div>
                                <div class="rendered-content mt-1"></div>
                            </div>
                        </div>
                    {% endfor %}
                {% else %}
                    <div class="text-center text-muted my-auto">
                        <p class="fs-5">Analyzing document...</p>
                    </div>
                {% endif %}
            </div>

            <!-- Sleek Input Footer -->
            <div class="card-footer bg-white border-top p-3">
                <form action="/chat/{{ document.id }}" method="POST" class="input-group">
                    <input type="text" name="question" class="form-control form-control-lg border-secondary-subtle shadow-none" placeholder="Ask a question about this document..." autocomplete="off" required>
                    <button class="btn btn-primary px-4 fw-semibold" type="submit">Send</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Script to render markdown & auto-scroll -->
    <script>
        document.querySelectorAll('.ai-message').forEach(el => {
            const rawText = el.getAttribute('data-raw-answer');
            const targetDiv = el.querySelector('.rendered-content');
            if (rawText && targetDiv) {
                targetDiv.innerHTML = marked.parse(rawText);
            }
        });

        const chatBox = document.getElementById('chat-box');
        chatBox.scrollTop = chatBox.scrollHeight;
    </script>

</body>
</html>
